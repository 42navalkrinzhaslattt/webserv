server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root ./html/default;
    
    # Default error pages
    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/50x.html;
    
    # Default index files
    index index.html;
    
    # Maximum client body size (1KB)
    client_max_body_size 1k;
    
    # Root location
    location / {
        # Allow all methods
        limit_except GET POST DELETE;
        
        # Enable directory listing
        autoindex on;
    }
    
    # Upload location
    location /upload {
        # Allow POST method
        limit_except POST;
        
        # Set upload directory
        upload_dir /uploads;
        
        # Maximum upload size (500 bytes)
        client_max_body_size 500;
    }
}
