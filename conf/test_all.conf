server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root ./html/default;
    
    # Default error pages
    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/50x.html;
    
    # Default index files
    index index.html index.htm welcome.html;
    
    # Maximum client body size (10MB)
    client_max_body_size 10m;
    
    # Root location
    location / {
        # Allow GET, POST, and DELETE methods
        limit_except GET POST DELETE;
        
        # Enable directory listing
        autoindex on;
    }
    
    # Test location with different directory
    location /test {
        # Use a different directory
        root ./html/test;
        
        # Only allow GET method
        limit_except GET;
        
        # Enable directory listing
        autoindex on;
    }
    
    # Upload location with smaller body size limit
    location /upload {
        # Allow POST method
        limit_except POST;
        
        # Set upload directory
        upload_dir /uploads;
        
        # Maximum upload size (500 bytes)
        client_max_body_size 500;
    }
}
