# Configuration file to test all required features

# Server 1 - Default server on port 8090
server {
    listen 127.0.0.1:8090;
    server_name localhost;
    root ./html/default;
    
    # Default error pages
    error_page 404 /custom_errors/404.html;
    error_page 500 502 503 504 /custom_errors/50x.html;
    
    # Default index files
    index index.html index.htm;
    
    # Maximum client body size (1KB)
    client_max_body_size 1k;
    
    # Root location
    location / {
        # Allow GET, POST, and DELETE methods
        limit_except GET POST DELETE;
        
        # Enable directory listing
        autoindex on;
    }
    
    # Static files location
    location /static {
        # Only allow GET method
        limit_except GET;
        
        # Disable directory listing
        autoindex off;
    }
    
    # CGI scripts location
    location /cgi-bin {
        # Allow GET and POST methods
        limit_except GET POST;
        
        # Register CGI handlers
        cgi_ext .py /usr/bin/python3;
        cgi_ext .pl /usr/bin/perl;
        cgi_ext .sh /bin/bash;
        cgi_dir /cgi-bin;
        
        # Disable directory listing
        autoindex off;
    }
    
    # File upload location
    location /upload {
        # Allow POST method
        limit_except POST;
        
        # Set upload directory
        upload_dir /uploads;
        
        # Maximum upload size (500 bytes)
        client_max_body_size 500;
    }
    
    # Redirect example
    location /redirect {
        return 301 /static;
    }
    
    # Different directory
    location /different {
        alias ./html/test;
        index welcome.html;
        limit_except GET;
    }
    
    # Location with restricted methods
    location /restricted {
        limit_except GET;
        # DELETE is not allowed here
    }
}

# Server 2 - Another server on port 8091
server {
    listen 127.0.0.1:8091;
    server_name test.local;
    root ./html/test;
    
    # Default error pages
    error_page 404 /custom_errors/404.html;
    
    # Default index files
    index welcome.html;
    
    # Root location
    location / {
        # Allow all methods
        limit_except GET POST DELETE;
        
        # Enable directory listing
        autoindex on;
    }
}

# Server 3 - Virtual host on port 8090
server {
    listen 127.0.0.1:8090;
    server_name example.com;
    root ./html/example;
    
    # Default index files
    index index.html;
    
    # Root location
    location / {
        # Allow GET method only
        limit_except GET;
        
        # Disable directory listing
        autoindex off;
    }
}
