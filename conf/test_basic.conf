server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root ./html/test_basic;
    
    # Default error pages
    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/50x.html;
    
    # Default index files
    index index.html index.htm;
    
    # Maximum client body size (10MB)
    client_max_body_size 10m;
    
    # Root location
    location / {
        # Allow GET, POST, and DELETE methods
        limit_except GET POST DELETE;
        
        # Enable directory listing
        autoindex on;
    }
    
    # Upload location
    location /upload {
        # Allow POST method
        limit_except POST;
        
        # Set upload directory
        upload_dir /uploads;
    }
    
    # Download location
    location /uploads {
        # Allow GET method
        limit_except GET;
        
        # Enable directory listing
        autoindex on;
    }
}
