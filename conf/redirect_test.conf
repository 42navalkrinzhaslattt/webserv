# Simple configuration for testing redirects
server {
    listen 127.0.0.1:8090;
    server_name localhost;
    root ./html/default;
    
    # Default index files
    index index.html index.htm;
    
    # Root location
    location / {
        # Allow GET, POST, and DELETE methods
        limit_except GET POST DELETE;
        
        # Enable directory listing
        autoindex on;
    }
    
    # Redirect example
    location /redirect {
        return 301 /;
    }
}
