server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root ./html/default;
    
    # Default error pages
    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/50x.html;
    
    # Default index files
    index index.html index.htm;
    
    # Root location - allow GET, POST, DELETE
    location / {
        limit_except GET POST DELETE;
        autoindex on;
    }
    
    # GET only location
    location /get-only {
        limit_except GET;
        autoindex on;
    }
    
    # POST only location
    location /post-only {
        limit_except POST;
        autoindex on;
    }
}
