# Complex configuration for webserv
# This configuration sets up multiple servers with different configurations

# Server 1 - Default server on port 8080
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root ./html/default;
    
    # Default error pages
    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/50x.html;
    
    # Default index files
    index index.html index.htm;
    
    # Maximum client body size (10MB)
    client_max_body_size 10m;
    
    # Root location
    location / {
        # Allow GET, POST, and DELETE methods
        limit_except GET POST DELETE;
        
        # Enable directory listing
        autoindex on;
    }
    
    # Static files location
    location /static {
        # Only allow GET method
        limit_except GET;
        
        # Disable directory listing
        autoindex off;
    }
    
    # CGI scripts location
    location /cgi-bin {
        # Allow GET and POST methods
        limit_except GET POST;
        
        # Register CGI handlers
        cgi_ext .py /usr/bin/python3;
        cgi_ext .pl /usr/bin/perl;
        cgi_ext .sh /bin/bash;
        cgi_dir /cgi-bin;
        
        # Disable directory listing
        autoindex off;
    }
    
    # File upload location
    location /upload {
        # Allow POST and PUT methods
        limit_except POST PUT;
        
        # Set upload directory
        upload_dir /uploads;
        
        # Maximum upload size (5MB)
        client_max_body_size 5m;
    }
    
    # Redirect example
    location /redirect {
        return 301 /;
    }
}

# Server 2 - Another server on port 8081
server {
    listen 127.0.0.1:8081;
    server_name test.local;
    root ./html/test;
    
    # Default error pages
    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/50x.html;
    
    # Default index files
    index index.html;
    
    # Root location
    location / {
        # Allow all methods
        limit_except GET POST DELETE;
        
        # Enable directory listing
        autoindex on;
    }
}

# Server 3 - Virtual host on port 8080
server {
    listen 127.0.0.1:8080;
    server_name example.local;
    root ./html/example;
    
    # Default index files
    index index.html;
    
    # Root location
    location / {
        # Allow GET method only
        limit_except GET;
        
        # Disable directory listing
        autoindex off;
    }
    
    # Custom location with alias
    location /docs {
        alias ./html/documents;
        
        # Allow GET method only
        limit_except GET;
        
        # Enable directory listing
        autoindex on;
    }
}

# Server 4 - Another port
server {
    listen 127.0.0.1:8082;
    server_name localhost;
    root ./html/other;
    
    # Default index files
    index index.html;
    
    # Root location
    location / {
        # Allow GET method only
        limit_except GET;
        
        # Disable directory listing
        autoindex off;
    }
}
