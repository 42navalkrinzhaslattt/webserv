server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root ./www;
    
    # Default index files
    index index.html;
    
    # Maximum client body size (10MB)
    client_max_body_size 10m;
    
    # CGI location
    location /cgi-bin {
        # Allow GET and POST methods
        limit_except GET POST;
        
        # Set CGI extensions
        cgi_pass .py /usr/bin/python3;
    }
}
