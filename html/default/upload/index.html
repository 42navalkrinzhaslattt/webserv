<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        form {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        input[type="file"] {
            margin-bottom: 20px;
            width: 100%;
        }
        input[type="submit"] {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #2980b9;
        }
        .note {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
        }
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8em;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>File Upload Example</h1>
        <p>Use the form below to upload a file to the server.</p>
        
        <form action="/upload" method="post" enctype="multipart/form-data">
            <label for="file">Select a file to upload:</label>
            <input type="file" id="file" name="file" required>
            <input type="submit" value="Upload File">
        </form>
        
        <div class="note">
            <p><strong>Note:</strong> Maximum file size is 5MB.</p>
            <p>Uploaded files will be stored in the server's uploads directory.</p>
        </div>
        
        <p><a href="/">Back to homepage</a></p>
        
        <footer>
            Webserv - HTTP/1.1 Server in C++98
        </footer>
    </div>
</body>
</html>
