<!DOCTYPE html>

<body>
    <header>
        <h1>Contact Webserv Test Site</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/static/pages/about.html">About</a></li>
                <li><a href="/static/pages/contact.html">Contact</a></li>

            </ul>
        </nav>
    </header>
    
    <main>
        <section>
            <h2>Contact Form</h2>
            <p>This is a mock contact form to test POST requests. The form doesn't actually submit data anywhere.</p>
            
            <form action="/contact-submit" method="post">
                <div style="margin-bottom: 15px;">
                    <label for="name" style="display: block; margin-bottom: 5px;">Name:</label>
                    <input type="text" id="name" name="name" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label for="email" style="display: block; margin-bottom: 5px;">Email:</label>
                    <input type="email" id="email" name="email" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label for="message" style="display: block; margin-bottom: 5px;">Message:</label>
                    <textarea id="message" name="message" rows="5" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ddd;"></textarea>
                </div>
                
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2023 Webserv Test Site</p>
    </footer>
</body>
