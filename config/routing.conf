server {
    listen 8080;
    server_name localhost;
    root /tmp/www;

    location / {
        root /tmp/www;
        index index.html index.htm;
        autoindex on;
        limit_except GET POST DELETE;
        client_max_body_size 10485760; # 10MB
    }

    location /uploads {
        root /tmp/www;
        upload_path /tmp/www/uploads;
        limit_except POST;
        client_max_body_size 20971520; # 20MB
    }

    location /static {
        root /tmp/www/static;
        autoindex on;
        limit_except GET;
    }

    location /redirect {
        return 301 /;
    }
}

server {
    listen 8081;
    server_name test.local;
    root /tmp/www2;

    location / {
        root /tmp/www2;
        index welcome.html;
        autoindex off;
    }
}
