server {
    # Test quoted strings with spaces
    server_name "my complex server name";
    root "/path/with/spaces/www/root";

    # Test quoted strings with special characters
    location "/api/v1/test" {
        index "special@index.html";
    }

    # Test multiline quoted string
    location "/multi/line" {
        index "This is a multiline string in the config";
    }

    # Test empty quoted string
    location "" {
        index "";
    }
}
